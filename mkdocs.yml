site_name: NMEA Simulator X
site_description: Free, open-source NMEA 0183 and Signal K data stream simulator for Windows, macOS and Linux.
site_url: https://dimitrios-kafetzis.github.io/NMEA_Simulator_X/
repo_url: https://github.com/Dimitrios-Kafetzis/NMEA_Simulator_X
repo_name: Dimitrios-Kafetzis/NMEA_Simulator_X
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Dimitrios Kafetzis. Licensed under GPL-3.0.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

hooks:
  - tools/doxygen/mkdocs_hook.py

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Your first simulated voyage: tutorials/first-voyage.md
      - Following a GPX track: tutorials/following-a-gpx-track.md
      - Recording and replaying a log: tutorials/recording-and-replaying-a-log.md
      - Feeding OpenCPN and a Signal K server at once: tutorials/opencpn-and-signal-k.md
      - Building a test fixture from a recorded log: tutorials/test-fixture-from-a-log.md
  - How-to guides:
      - how-to/index.md
      - Install on Windows, macOS or Linux: how-to/install.md
      - Build from source: how-to/build-from-source.md
      - Run the simulator headless: how-to/run-headless.md
      - Follow a track: how-to/follow-a-track.md
      - Set a destination: how-to/set-a-destination.md
      - Connect a Signal K server: how-to/signal-k.md
      - Follow the vessel in Google Earth: how-to/google-earth.md
      - Submit the package-manager manifests: how-to/submit-package-manifests.md
  - Reference:
      - reference/index.md
      - Desktop application: reference/desktop-app.md
      - Command-line tool: reference/cli.md
      - Profile file format: reference/profile.md
      - NMEA 0183 sentences: reference/nmea0183-sentences.md
      - AIS messages: reference/ais.md
      - Signal K output: reference/signalk.md
      - ViewSync output: reference/viewsync.md
      - Transports: reference/transports.md
      - Track files: reference/track-files.md
      - Log files: reference/log-format.md
      - C++ API: reference/api.md
  - Explanation:
      - explanation/index.md
      - Architecture: explanation/architecture.md
      - Simulation model: explanation/simulation-model.md
      - Requirements and feature parity: explanation/requirements.md
  - Decisions:
      - adr/index.md
      - "0001 Native C++ with Qt 6 Widgets": adr/0001-cpp-qt-widgets.md
      - "0002 Layered libraries with a Qt-free core": adr/0002-layered-libraries.md
      - "0003 CMake presets and vcpkg": adr/0003-cmake-vcpkg.md
      - "0004 GPL-3.0 license": adr/0004-gpl-license.md
      - "0005 Unsigned distribution": adr/0005-unsigned-distribution.md
      - "0006 Documentation standard": adr/0006-documentation-standard.md
      - "0007 Trunk-based development and releases": adr/0007-trunk-based-releases.md
      - "0008 Testing strategy": adr/0008-testing-strategy.md
      - "0009 Desktop shell": adr/0009-desktop-shell.md
      - "0010 Map tiles": adr/0010-map-tiles.md
      - "0011 Track and replay sources": adr/0011-track-and-replay-sources.md
      - "0012 Log file format": adr/0012-log-file-format.md
      - "0013 AIS encoder": adr/0013-ais-encoder.md
      - "0014 Multi-encoding outputs": adr/0014-multi-encoding-outputs.md
      - "0015 Release workflow": adr/0015-release-workflow.md
      - "0016 Linux packages": adr/0016-linux-packages.md
      - "0017 C++ reference in MkDocs": adr/0017-cpp-reference-in-mkdocs.md
  - Development:
      - development/index.md
      - Coding standards: development/coding-standards.md
      - Release process: development/release-process.md
      - Roadmap: development/roadmap.md
