name: Release Please

# Opens and maintains a release pull request from Conventional Commits on main. Merging that
# pull request tags a release and updates CHANGELOG.md and the project version.
# Requires "Allow GitHub Actions to create and approve pull requests" in the repository's
# Actions settings.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
