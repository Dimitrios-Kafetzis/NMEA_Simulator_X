# SPDX-License-Identifier: GPL-3.0-only
# Opens and maintains a release pull request from Conventional Commits on main. Merging that
# pull request tags a release and updates CHANGELOG.md and the project version; the packages
# job then builds and attaches the installers (release.yml, ADR 0015).
# Requires "Allow GitHub Actions to create and approve pull requests" in the repository's
# Actions settings.
#
# Triggers: every push to main, including the merge of the release pull request itself.
#
# Permissions: contents: write to push the release branch, the tag and the release, and
# pull-requests: write to open and update the release pull request; the packages job hands
# contents: write on to release.yml. Release Please works with the workflow's GITHUB_TOKEN; no
# other secrets and no repository variables.
#
# Neither job is a required check.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Reads the release rules and the extra files to bump (CMakeLists.txt, vcpkg.json) from
      # the configuration, and the last released version from the manifest. On the merge of a
      # release pull request it creates the tag and the release and sets release_created.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag created with GITHUB_TOKEN does not start other workflows, so the release workflow is
  # called from here instead of listening for the tag.
  packages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
