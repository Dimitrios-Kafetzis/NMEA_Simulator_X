# SPDX-License-Identifier: GPL-3.0-only
# Continuous integration. Builds the project with the ci-* presets on Linux, Windows and macOS,
# runs the unit tests, smoke-tests and installs the command-line tool, cross-checks its output
# with independent parsers, tests those checkers and, on Linux, reports the test coverage. Two further jobs check the
# C++ formatting and build the documentation site with the C++ reference.
#
# Triggers: pushes to main, every pull request and manual dispatch. A newer run for the same
# ref cancels the one in progress. Pull requests that Release Please opens with GITHUB_TOKEN
# start no run; closing and reopening them starts one (docs/development/release-process.md).
#
# Permissions: read access to the repository contents. No secrets, no repository variables.
#
# Required checks: every job of this workflow. Linux (GCC), Windows (MSVC), macOS (Clang),
# Code formatting and Documentation are required status checks of the branch protection on
# main, so renaming a job means updating the branch protection too.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Qt and Doxygen versions are pinned in .github/versions.env, which the jobs that need them
# read in their first step after the checkout.

jobs:
  # One job per platform, named after the platform and compiler. ci-linux builds with GCC,
  # warnings as errors, AddressSanitizer, UndefinedBehaviorSanitizer and coverage; ci-windows
  # (MSVC) and ci-macos (Apple Clang, which adds -Wdocumentation) with warnings as errors.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            preset: ci-linux
            qt_host: linux
            qt_arch: linux_gcc_64
          - name: Windows (MSVC)
            os: windows-2022
            preset: ci-windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - name: macOS (Clang)
            os: macos-15
            preset: ci-macos
            qt_host: mac
            qt_arch: clang_64
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      # QT_VERSION, DOXYGEN_VERSION and DOXYGEN_SHA256 from .github/versions.env.
      - name: Read the pinned tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"

      # Sets QT_ROOT_DIR, through which the presets find Qt.
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtserialport qtwebsockets
          cache: true

      # The Ninja generator of the presets needs the compiler environment that the Visual
      # Studio developer prompt would provide.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The runners come with vcpkg (VCPKG_INSTALLATION_ROOT). Its binary cache is moved into
      # the workspace so that the next step can save and restore the built dependencies.
      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      # Keyed on vcpkg.json (ADR 0003); after a change to it, the newest cache of the same
      # platform is restored and vcpkg rebuilds only what changed.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Runs every subcommand and every source (simulation, track, route, replay, recording)
      # and every encoding once on the freshly built tool.
      - name: Smoke-test the command-line tool
        shell: bash
        run: |
          NMEASIM=./build/${{ matrix.preset }}/src/cli/nmeasim
          if [[ "${{ runner.os }}" == "Windows" ]]; then NMEASIM="$NMEASIM.exe"; fi
          "$NMEASIM" --version
          "$NMEASIM" ports
          "$NMEASIM" interfaces
          "$NMEASIM" sentences
          "$NMEASIM" profile init profile.json
          "$NMEASIM" profile show profile.json > /dev/null
          "$NMEASIM" run --profile profile.json --stdout --quiet --duration 2 | head -5
          "$NMEASIM" run --track samples/saronic-gulf.gpx --stdout --quiet --duration 2 | head -3
          "$NMEASIM" run --track samples/saronic-route.gpx --speed 12 --stdout --quiet --duration 1 | head -3
          "$NMEASIM" run --replay tests/fixtures/logs/plain.nmea --stdout --quiet | wc -l
          "$NMEASIM" run --record recorded.log --stdout --quiet --duration 1 > /dev/null
          test -s recorded.log && head -3 recorded.log
          "$NMEASIM" run --replay recorded.log --stdout --quiet | wc -l
          "$NMEASIM" run --stdout --quiet --duration 1 --encoding signalk | head -2
          "$NMEASIM" run --stdout --quiet --duration 1 --encoding viewsync | head -2

      # Checks the install rules that the packages are made from: Qt deployed next to the
      # executables on Windows and into the signed bundle on macOS, and on Linux, where Qt is
      # not deployed, the desktop file and the AppStream metadata.
      - name: Install into a staging directory
        shell: bash
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "$PWD/staging"
          case "${{ runner.os }}" in
            Windows) ./staging/nmeasim.exe --version; ls staging/Qt6Core*.dll ;;
            macOS)
              ./staging/NMEASimulatorX.app/Contents/MacOS/nmeasim --version
              test -d staging/NMEASimulatorX.app/Contents/Frameworks/QtCore.framework
              codesign --verify --deep --strict --verbose=2 staging/NMEASimulatorX.app ;;
            Linux)
              LD_LIBRARY_PATH="$QT_ROOT_DIR/lib" ./staging/bin/nmeasim --version
              sudo apt-get install -y --no-install-recommends appstream desktop-file-utils > /dev/null
              desktop-file-validate staging/share/applications/*.desktop
              appstreamcli validate --no-net staging/share/metainfo/*.metainfo.xml ;;
          esac

      - name: Set up Python for the stream cross-check
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pynmea2 and pyais, pinned to exact versions, parse the stream independently of the
      # project's own decoder. --expect is the minimum number of distinct sentence formatters.
      - name: Cross-check the NMEA stream with an independent parser
        shell: bash
        run: |
          pip install pynmea2==1.19.0 pyais==2.9.4
          NMEASIM=./build/${{ matrix.preset }}/src/cli/nmeasim
          if [[ "${{ runner.os }}" == "Windows" ]]; then NMEASIM="$NMEASIM.exe"; fi
          "$NMEASIM" run --stdout --quiet --duration 3 --enable MWV-T | python3 tools/check_nmea_stream.py --expect 21
          "$NMEASIM" run --track samples/saronic-gulf.gpx --stdout --quiet --duration 2 | python3 tools/check_nmea_stream.py --expect 20
          "$NMEASIM" run --replay tests/fixtures/logs/recorded.log --stdout --quiet | python3 tools/check_nmea_stream.py --expect 8
          "$NMEASIM" run --stdout --quiet --duration 2 --destination 37.7466,23.4275,AEGINA | python3 tools/check_nmea_stream.py --expect 24
          python3 tools/check_ais_stream.py --mmsi 239000001 --name "NMEA SIMULATOR X" --callsign SIMX < tests/fixtures/ais/own_vessel.nmea
          "$NMEASIM" run --stdout --quiet --duration 2 --enable VDM-POS --enable VDM-STATIC | python3 tools/check_ais_stream.py --mmsi 239000001 --name "NMEA SIMULATOR X" --callsign SIMX
          "$NMEASIM" run --stdout --quiet --duration 2 --encoding signalk --destination 37.7466,23.4275,AEGINA | python3 tools/check_signalk_stream.py --context vessels.urn:mrn:imo:mmsi:239000001 --require-path navigation.position --require-path navigation.courseRhumbline.crossTrackError --require-path propulsion.port.revolutions
          python3 tools/check_signalk_stream.py --min-deltas 1 < tests/fixtures/signalk/delta.jsonl
          "$NMEASIM" run --stdout --quiet --duration 2 --encoding viewsync | python3 tools/check_viewsync_stream.py

      # The unit tests of the Python tools (tools/tests): a malformed stream or coverage
      # summary must fail its check, not pass it or end in a traceback. They use the pynmea2
      # and pyais that the previous step installed.
      - name: Test the Python tools
        shell: bash
        run: python3 -m unittest discover -s tools/tests -v

      # The ci-linux preset instruments the build for gcov; the report runs last so that the
      # smoke tests above count towards the coverage of the command-line tool.
      - name: Coverage report
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install gcovr==8.6
          mkdir -p coverage
          gcovr --root . --filter src/ --json-summary coverage.json --html-nested coverage/index.html
          python3 tools/coverage_summary.py coverage.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Also after a failure, so that a partial report can be inspected.
      - name: Upload the coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  format:
    name: Code formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned: another clang-format release may format the same code differently.
      - name: Install clang-format
        run: pip install clang-format==23.1.1

      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # QT_VERSION, DOXYGEN_VERSION and DOXYGEN_SHA256 from .github/versions.env.
      - name: Read the pinned tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"

      # The release binary of the pinned version, verified against its SHA-256 before use.
      - name: Install Doxygen
        run: |
          curl -sSfL -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  doxygen.tar.gz" | sha256sum --check
          tar -xzf doxygen.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # The MkDocs hook runs Doxygen, which treats every warning as an error (an undocumented
      # entity, parameter, return value or enumerator in src/ or tests/, or a malformed
      # comment), fails on C++ files without their licence line or file comment, and generates
      # the C++ reference pages. NMEASIM_REQUIRE_DOXYGEN makes a missing Doxygen an error
      # instead of placeholder pages.
      - name: Build documentation site and C++ reference (strict)
        env:
          NMEASIM_REQUIRE_DOXYGEN: "1"
        run: mkdocs build --strict

      # The licence identifier on the first line of every C++, Python, CMake, workflow and
      # shell file.
      - name: Check file headers
        run: python3 tools/check_file_headers.py

      # PEP 257 docstrings in the Google layout for every Python module, class and function,
      # with every argument documented; the rules are in ruff.toml. Ruff is pinned like
      # clang-format so that a new release cannot fail an unchanged commit.
      - name: Check Python docstrings
        run: |
          pip install ruff==0.16.8
          ruff check .
