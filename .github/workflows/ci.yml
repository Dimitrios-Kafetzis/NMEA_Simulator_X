name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.10.3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            preset: ci-linux
            qt_host: linux
            qt_arch: linux_gcc_64
          - name: Windows (MSVC)
            os: windows-2022
            preset: ci-windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - name: macOS (Clang)
            os: macos-15
            preset: ci-macos
            qt_host: mac
            qt_arch: clang_64
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtserialport qtwebsockets
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke-test the command-line tool
        shell: bash
        run: |
          NMEASIM=./build/${{ matrix.preset }}/src/cli/nmeasim
          if [[ "${{ runner.os }}" == "Windows" ]]; then NMEASIM="$NMEASIM.exe"; fi
          "$NMEASIM" --version
          "$NMEASIM" ports
          "$NMEASIM" interfaces
          "$NMEASIM" sentences
          "$NMEASIM" profile init profile.json
          "$NMEASIM" profile show profile.json > /dev/null
          "$NMEASIM" run --profile profile.json --stdout --quiet --duration 2 | head -5
          "$NMEASIM" run --track samples/saronic-gulf.gpx --stdout --quiet --duration 2 | head -3
          "$NMEASIM" run --track samples/saronic-route.gpx --speed 12 --stdout --quiet --duration 1 | head -3
          "$NMEASIM" run --replay tests/fixtures/logs/plain.nmea --stdout --quiet | wc -l
          "$NMEASIM" run --record recorded.log --stdout --quiet --duration 1 > /dev/null
          test -s recorded.log && head -3 recorded.log
          "$NMEASIM" run --replay recorded.log --stdout --quiet | wc -l
          "$NMEASIM" run --stdout --quiet --duration 1 --encoding signalk | head -2
          "$NMEASIM" run --stdout --quiet --duration 1 --encoding viewsync | head -2

      - name: Install into a staging directory
        shell: bash
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "$PWD/staging"
          case "${{ runner.os }}" in
            Windows) ./staging/nmeasim.exe --version; ls staging/Qt6Core*.dll ;;
            macOS)
              ./staging/NMEASimulatorX.app/Contents/MacOS/nmeasim --version
              test -d staging/NMEASimulatorX.app/Contents/Frameworks/QtCore.framework
              codesign --verify --deep --strict --verbose=2 staging/NMEASimulatorX.app ;;
            Linux)
              LD_LIBRARY_PATH="$QT_ROOT_DIR/lib" ./staging/bin/nmeasim --version
              sudo apt-get install -y --no-install-recommends appstream desktop-file-utils > /dev/null
              desktop-file-validate staging/share/applications/*.desktop
              appstreamcli validate --no-net staging/share/metainfo/*.metainfo.xml ;;
          esac

      - name: Set up Python for the stream cross-check
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cross-check the NMEA stream with an independent parser
        shell: bash
        run: |
          pip install pynmea2==1.19.0 pyais==2.9.4
          NMEASIM=./build/${{ matrix.preset }}/src/cli/nmeasim
          if [[ "${{ runner.os }}" == "Windows" ]]; then NMEASIM="$NMEASIM.exe"; fi
          "$NMEASIM" run --stdout --quiet --duration 3 --enable MWV-T | python3 tools/check_nmea_stream.py --expect 21
          "$NMEASIM" run --track samples/saronic-gulf.gpx --stdout --quiet --duration 2 | python3 tools/check_nmea_stream.py --expect 20
          "$NMEASIM" run --replay tests/fixtures/logs/recorded.log --stdout --quiet | python3 tools/check_nmea_stream.py --expect 8
          "$NMEASIM" run --stdout --quiet --duration 2 --destination 37.7466,23.4275,AEGINA | python3 tools/check_nmea_stream.py --expect 24
          python3 tools/check_ais_stream.py --mmsi 239000001 --name "NMEA SIMULATOR X" --callsign SIMX < tests/fixtures/ais/own_vessel.nmea
          "$NMEASIM" run --stdout --quiet --duration 2 --enable VDM-POS --enable VDM-STATIC | python3 tools/check_ais_stream.py --mmsi 239000001 --name "NMEA SIMULATOR X" --callsign SIMX
          "$NMEASIM" run --stdout --quiet --duration 2 --encoding signalk --destination 37.7466,23.4275,AEGINA | python3 tools/check_signalk_stream.py --context vessels.urn:mrn:imo:mmsi:239000001 --require-path navigation.position --require-path navigation.courseRhumbline.crossTrackError --require-path propulsion.port.revolutions
          python3 tools/check_signalk_stream.py --min-deltas 1 < tests/fixtures/signalk/delta.jsonl
          "$NMEASIM" run --stdout --quiet --duration 2 --encoding viewsync | python3 tools/check_viewsync_stream.py

      # The ci-linux preset instruments the build for gcov; the report runs last so that the
      # smoke tests above count towards the coverage of the command-line tool.
      - name: Coverage report
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install gcovr==8.6
          mkdir -p coverage
          gcovr --root . --filter src/ --json-summary coverage.json --html-nested coverage/index.html
          python3 tools/coverage_summary.py coverage.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  format:
    name: Code formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==23.1.1

      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build documentation site (strict)
        run: mkdocs build --strict
