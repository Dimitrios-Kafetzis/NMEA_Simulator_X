name: Publish documentation

# Deploys the MkDocs site to GitHub Pages. Requires the repository to be public (or on a paid
# plan), Pages configured with source "GitHub Actions", and the repository variable
# DEPLOY_DOCS set to "true". Until then this workflow only runs on manual dispatch.

on:
  push:
    branches: [main]
    # The C++ reference is generated from every source and test file, so a change to any of
    # them, or to the tools that generate the site, republishes it.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

env:
  DOXYGEN_VERSION: 1.18.0
  DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen
        run: |
          curl -sSfL -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  doxygen.tar.gz" | sha256sum --check
          tar -xzf doxygen.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build site and C++ reference
        env:
          NMEASIM_REQUIRE_DOXYGEN: "1"
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
