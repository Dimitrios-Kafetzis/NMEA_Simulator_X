# SPDX-License-Identifier: GPL-3.0-only
# CodeQL code scanning of the C++ sources. The job builds the ci-linux preset while CodeQL
# watches the compiler (build mode manual), analyses the result and uploads the findings to the
# repository's code scanning alerts.
#
# Triggers: pushes to main, pull requests into main, and a weekly run on Mondays at 03:17 UTC,
# which applies new CodeQL queries to unchanged code.
#
# Permissions: read access to the contents, and security-events: write to upload the results.
# No secrets, no repository variables.
#
# Its job, Analyze C++, is not a required check.

name: CodeQL

# Code scanning is free for public repositories only, so the job is skipped while the
# repository is private.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      # QT_VERSION, the Qt that ci.yml builds with, from .github/versions.env.
      - name: Read the pinned tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtserialport qtwebsockets
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      # The runner's vcpkg with its binary cache in the workspace, as in ci.yml, so that the
      # dependencies are not rebuilt from source on every run.
      - name: Prepare vcpkg binary cache
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      # Keyed on vcpkg.json like the Linux job of ci.yml, whose cache it shares: the same
      # runner image and preset build the same dependencies (the options below change only
      # first-party code). The cache is restored before CodeQL watches the build, so the
      # dependencies it restores are not compiled and not analysed.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      # CodeQL analyses the code that this build compiles. The sanitizers and the coverage
      # instrumentation of the ci-linux preset are switched off: they only slow the build down
      # and add nothing to the analysis.
      - name: Build
        run: |
          cmake --preset ci-linux -DNMEASIM_ENABLE_SANITIZERS=OFF -DNMEASIM_ENABLE_COVERAGE=OFF
          cmake --build --preset ci-linux

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
