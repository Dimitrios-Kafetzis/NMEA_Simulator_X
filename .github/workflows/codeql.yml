# SPDX-License-Identifier: GPL-3.0-only
# CodeQL code scanning of the C++ sources. The job builds the ci-linux preset while CodeQL
# watches the compiler (build mode manual), analyses the result and uploads the findings to the
# repository's code scanning alerts.
#
# Triggers: pushes to main, pull requests into main, and a weekly run on Mondays at 03:17 UTC,
# which applies new CodeQL queries to unchanged code.
#
# Permissions: read access to the contents, and security-events: write to upload the results.
# No secrets, no repository variables.
#
# Its job, Analyze C++, is not a required check.

name: CodeQL

# Code scanning is free for public repositories only, so the job is skipped while the
# repository is private.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      # QT_VERSION, the Qt that ci.yml builds with, from .github/versions.env.
      - name: Read the pinned tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtserialport qtwebsockets
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      # CodeQL analyses the code that this build compiles. The sanitizers of the ci-linux
      # preset are switched off; the dependencies are built by vcpkg without a binary cache.
      - name: Build
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --preset ci-linux -DNMEASIM_ENABLE_SANITIZERS=OFF
          cmake --build --preset ci-linux

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
